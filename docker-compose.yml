services:
  db:
    image: mariadb
    container_name: db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: asdf1234
    volumes:
      - ./polls-backend/db/db-data:/var/lib/mysql
    ports:
      - 3306:3306

  polls-backend:
    container_name: polls-backend
    build: ./polls-backend
    restart: always
    environment:
      DB_HOST: db
    ports:
      - 8080:8080
    depends_on:
      - db

  polls-frontend:
    container_name: polls-frontend
    build: ./polls-frontend
    restart: always
    ports:
      - 80:80
    depends_on:
      - polls-backend